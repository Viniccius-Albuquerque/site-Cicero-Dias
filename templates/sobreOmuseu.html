<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Museu Cicero Dias</title>
    <link rel="stylesheet" href="/styles/sobreOmuseu.css">
</head>
<body>
    <div class="totem-container">
        <!-- BARRA LATERAL ESQUERDA -->
        <div class="sidebar">

            <div class="museum-brand">
                <h2>Museu Cícero Dias</h2>
            </div>

            <div class="nav-menu">

                <!-- SOBRE O MUSEU -->
                <div class="nav-group">
                    <button class="nav-item" data-topic="sobreMuseu">
                        O Museu
                    </button>

                    <div class="subtopics">
                        <button class="subtopic-item" data-target="diretrizes">
                            Diretrizes de Visitação
                        </button>

                        <button class="subtopic-item" data-target="acessibilidade">
                            Acessibilidade
                        </button>

                        <button class="subtopic-item" data-target="horario">
                            Horário de Funcionamento
                        </button>

                        <button class="subtopic-item" data-target="festividades">
                            Festividades
                        </button>
                    </div>
                </div>

                <!-- ORIGEM DO MUNICÍPIO -->
                <div class="nav-group">
                    <button class="nav-item" data-topic="historiaEscada">
                        Origem do Município
                    </button>

                    <div class="subtopics">
                        <button class="subtopic-item" data-target="preColonial">
                            Período Pré-Colonial
                        </button>

                        <button class="subtopic-item" data-target="colonizacao">
                            Início da Colonização
                        </button>

                        <button class="subtopic-item" data-target="marcoLegal">
                            Marco Legal de Escada
                        </button>

                        <button class="subtopic-item" data-target="evolucao">
                            Evolução Administrativa
                        </button>

                        <button class="subtopic-item" data-target="heranca">
                            Herança Indígena
                        </button>

                        <button class="subtopic-item" data-target="consolidacao">
                            Consolidação Institucional
                        </button>
                    </div>
                </div>

                <!-- BARONATOS -->
                <div class="nav-group">
                    <button class="nav-item" data-topic="baronatos">
                        Baronatos
                    </button>
                </div>

                <!-- CÍCERO DIAS -->
                <div class="nav-group">
                    <button class="nav-item" data-topic="ciceroDias">
                        Cícero Dias
                    </button>

                    <div class="subtopics">
                        <button class="subtopic-item" data-target="inicioVida">
                            Início de Vida e Formação
                        </button>

                        <button class="subtopic-item" data-target="modernismo">
                            Primeira Fase e Modernismo
                        </button>

                        <button class="subtopic-item" data-target="internacional">
                            Carreira Internacional
                        </button>

                        <button class="subtopic-item" data-target="murais">
                            Abstracionismo e Murais
                        </button>

                        <button class="subtopic-item" data-target="legado">
                            Reconhecimento e Legado
                        </button>
                    </div>
                </div>

                <!-- CONTATO -->
                <div class="nav-group">
                    <button class="nav-item" data-topic="contato">
                        Contato
                    </button>
                </div>

            </div>

            <div class="sidebar-footer">
                <img src="/images/QRcode.png" alt="Acesse o QR Code" class="qr-code-img">
                <p>Acesse o <strong>QR Code</strong><br>e saiba mais.</p>
            </div>

        </div>

        <!-- ÁREA PRINCIPAL -->
        <main class="main-content" id="mainContent">
            <div class="content-scroll">

                <div class="content-body" id="contentBody">
                    <!-- Conteúdo será preenchido via JavaScript -->

                </div>
                
                <footer class="footer-totem">
                    teste-totem
                </footer>
            </div>
        </main>
    </div>

    <script src="/scripts/sobreOmuseu.js"></script>
</body>
</html>
