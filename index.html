<!--como a primeira pagina é descanso, esse é o index-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museu Cicero Dias</title>
    <link rel="stylesheet" href="/styles/descanso.css">
</head>
<body>
    <div class="totem">
        <div class="frame-descanso" id="telaDescanso">
            <!-- Carrossel de fundo -->
            <div class="carrossel">
                <div class="slide active" style="background-image: url('https://picsum.photos/1920/1080?random=1')"></div>
                <div class="slide" style="background-image: url('https://picsum.photos/1920/1080?random=2')"></div>
                <div class="slide" style="background-image: url('https://picsum.photos/1920/1080?random=3')"></div>
                <div class="slide" style="background-image: url('https://picsum.photos/1920/1080?random=4')"></div>
            </div>

            <!-- Overlay embaçado no topo -->
            <div class="overlay-top"></div>

            <!-- Overlay embaçado no rodapé -->
            <div class="overlay-bottom"></div>

            <!-- Cabeçalho (sobre o overlay) -->
            <div class="topo">
                <h1 class="museu-titulo">Museu Cicero Dias</h1>
            </div>

            <!--frase sutil-->
            <div class="frase">
                <h2 class="museu-frase">Toque para continuar</h2>
            </div>

            <!-- Rodapé com frase sutil -->
            <div class="rodape">
                <span class="mini">teste-totem</span>
            </div>
        </div>
    </div>

    <script src="/scripts/descanso.js"></script>
</body>
</html>
